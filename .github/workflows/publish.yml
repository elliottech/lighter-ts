name: Publish to npm

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publishes through npm trusted publishing (OIDC): no npm token anywhere,
    # the package's trusted publisher on npmjs.com must point at this file.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Enable Corepack
        run: corepack enable

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@11

      # Publishes the version in package.json; a merge that does not bump it
      # is a no-op here.
      - name: Skip if this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "lighter-ts@${VERSION}" version > /dev/null 2>&1; then
            echo "lighter-ts@${VERSION} is already published; skipping"
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Cache node_modules
        if: steps.check.outputs.publish == 'true'
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-22.19.0-node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-22.19.0-node_modules-

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Build package
        if: steps.check.outputs.publish == 'true'
        run: yarn build

      # `prepack` (the secret scan) runs as part of publish. Provenance is
      # attached automatically because the publish is authenticated via OIDC.
      - name: Publish package
        if: steps.check.outputs.publish == 'true'
        run: npm publish
